openapi: 3.2.0
info:
  title: LiteLLM Guardrails API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.93.0
tags:
- name: guardrails
paths:
  /apply_guardrail:
    post:
      description: 'Apply a guardrail to text input and return the processed result.


        This endpoint allows testing guardrails by applying them to custom text inputs.'
      operationId: apply_guardrail_apply_guardrail_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyGuardrailRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyGuardrailResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Apply Guardrail
      tags:
      - guardrails
  /guardrails:
    post:
      description: 'Create a new guardrail


        👉 Guardrail docs


        Example Request:

        ```bash

        curl -X POST "http://localhost:4000/guardrails" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "guardrail": {

        "guardrail_name": "my-bedrock-guard",

        "litellm_params": {

        "guardrail": "bedrock",

        "mode": "pre_call",

        "guardrailIdentifier": "ff6ujrregl1q",

        "guardrailVersion": "DRAFT",

        "default_on": true

        },

        "guardrail_info": {

        "description": "Bedrock content moderation guardrail"

        }

        }

        }''

        ```


        Example Response:

        ```json

        {

        "guardrail_id": "123e4567-e89b-12d3-a456-426614174000",

        "guardrail_name": "my-bedrock-guard",

        "litellm_params": {

        "guardrail": "bedrock",

        "mode": "pre_call",

        "guardrailIdentifier": "ff6ujrregl1q",

        "guardrailVersion": "DRAFT",

        "default_on": true

        },

        "guardrail_info": {

        "description": "Bedrock content moderation guardrail"

        },

        "created_at": "2023-11-09T12:34:56.789Z",

        "updated_at": "2023-11-09T12:34:56.789Z"

        }

        ```'
      operationId: create_guardrail_guardrails_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuardrailRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Create Guardrail
      tags:
      - guardrails
  /guardrails/apply_guardrail:
    post:
      description: 'Apply a guardrail to text input and return the processed result.


        This endpoint allows testing guardrails by applying them to custom text inputs.'
      operationId: apply_guardrail_guardrails_apply_guardrail_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyGuardrailRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyGuardrailResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Apply Guardrail
      tags:
      - guardrails
  /guardrails/list:
    get:
      description: 'List the guardrails that are available on the proxy server


        👉 Guardrail docs


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/guardrails/list" -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "guardrails": [

        {

        "guardrail_name": "bedrock-pre-guard",

        "guardrail_info": {

        "params": [

        {

        "name": "toxicity_score",

        "type": "float",

        "description": "Score between 0-1 indicating content toxicity level"

        },

        {

        "name": "pii_detection",

        "type": "boolean"

        }

        ]

        }

        }

        ]

        }

        ```'
      operationId: list_guardrails_guardrails_list_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGuardrailsResponse'
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: List Guardrails
      tags:
      - guardrails
  /guardrails/register:
    post:
      description: 'Register a guardrail for onboarding (team submission).


        Accepts a guardrail config in the

        Generic Guardrail API format.

        The submission is stored with status `pending_review` until an admin approves it.'
      operationId: register_guardrail_guardrails_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterGuardrailRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterGuardrailResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Register Guardrail
      tags:
      - guardrails
  /guardrails/submissions:
    get:
      description: 'List team guardrail submissions. Returns only guardrails with a team_id.


        Admins see all submissions. Non-admin users see submissions for teams they are

        a member of.


        Status values: pending_review (team-registered, awaiting approval), active (approved), rejected.


        Optional filters:

        - status: pending_review | active | rejected

        - team_id: filter by specific team (non-admins must be a member of that team)

        - search: name/description'
      operationId: list_guardrail_submissions_guardrails_submissions_get
      parameters:
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - in: query
        name: team_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Team Id
      - in: query
        name: search
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGuardrailSubmissionsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: List Guardrail Submissions
      tags:
      - guardrails
  /guardrails/submissions/{guardrail_id}:
    get:
      description: Get a single guardrail submission by id. Non-admins may only access submissions for teams they belong to.
      operationId: get_guardrail_submission_guardrails_submissions__guardrail_id__get
      parameters:
      - in: path
        name: guardrail_id
        required: true
        schema:
          title: Guardrail Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailSubmissionItem'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Get Guardrail Submission
      tags:
      - guardrails
  /guardrails/submissions/{guardrail_id}/approve:
    post:
      description: 'Approve a pending guardrail submission: set status to active and initialize in memory (admin only).'
      operationId: approve_guardrail_submission_guardrails_submissions__guardrail_id__approve_post
      parameters:
      - in: path
        name: guardrail_id
        required: true
        schema:
          title: Guardrail Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Approve Guardrail Submission
      tags:
      - guardrails
  /guardrails/submissions/{guardrail_id}/reject:
    post:
      description: Reject a guardrail submission (admin only).
      operationId: reject_guardrail_submission_guardrails_submissions__guardrail_id__reject_post
      parameters:
      - in: path
        name: guardrail_id
        required: true
        schema:
          title: Guardrail Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Reject Guardrail Submission
      tags:
      - guardrails
  /guardrails/test_custom_code:
    post:
      description: 'Test custom code guardrail logic without creating a guardrail.


        This endpoint allows admins to experiment with custom code guardrails by:

        1. Compiling the provided code in a sandbox

        2. Executing the apply_guardrail function with test input

        3. Returning the result (allow/block/modify)


        👉 Custom Code Guardrail docs


        Example Request:

        ```bash

        curl -X POST "http://localhost:4000/guardrails/test_custom_code" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "custom_code": "def apply_guardrail(inputs, request_data, input_type):\n for text in inputs[\"texts\"]:\n if regex_match(text, r\"\\d{3}-\\d{2}-\\d{4}\"):\n return block(\"SSN detected\")\n return allow()",

        "test_input": {

        "texts": ["My SSN is 123-45-6789"]

        },

        "input_type": "request"

        }''

        ```


        Example Success Response (blocked):

        ```json

        {

        "success": true,

        "result": {

        "action": "block",

        "reason": "SSN detected"

        },

        "error": null,

        "error_type": null

        }

        ```


        Example Success Response (allowed):

        ```json

        {

        "success": true,

        "result": {

        "action": "allow"

        },

        "error": null,

        "error_type": null

        }

        ```


        Example Success Response (modified):

        ```json

        {

        "success": true,

        "result": {

        "action": "modify",

        "texts": ["My SSN is [REDACTED]"]

        },

        "error": null,

        "error_type": null

        }

        ```


        Example Error Response (compilation error):

        ```json

        {

        "success": false,

        "result": null,

        "error": "Syntax error in custom code: invalid syntax (, line 1)",

        "error_type": "compilation"

        }

        ```'
      operationId: test_custom_code_guardrail_guardrails_test_custom_code_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCustomCodeGuardrailRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCustomCodeGuardrailResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Test Custom Code Guardrail
      tags:
      - guardrails
  /guardrails/ui/add_guardrail_settings:
    get:
      description: 'Get the UI settings for the guardrails


        Returns:

        - Supported entities for guardrails

        - Supported modes for guardrails

        - PII entity categories for UI organization

        - Content filter settings (patterns and categories)'
      operationId: get_guardrail_ui_settings_guardrails_ui_add_guardrail_settings_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: Get Guardrail Ui Settings
      tags:
      - guardrails
  /guardrails/ui/category_yaml/{category_name}:
    get:
      description: 'Get the YAML or JSON content for a specific content filter category.


        Args:

        category_name: The name of the category (e.g., "bias_gender", "harmful_self_harm")


        Returns:

        The raw YAML or JSON content of the category file with file type indicator'
      operationId: get_category_yaml_guardrails_ui_category_yaml__category_name__get
      parameters:
      - in: path
        name: category_name
        required: true
        schema:
          title: Category Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Get Category Yaml
      tags:
      - guardrails
  /guardrails/ui/major_airlines:
    get:
      description: 'Get the major airlines list from IATA (competitor intent, airline type).

        Returns airline id, match variants (pipe-separated), and tags.'
      operationId: get_major_airlines_guardrails_ui_major_airlines_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: Get Major Airlines
      tags:
      - guardrails
  /guardrails/ui/provider_specific_params:
    get:
      description: 'Get provider-specific parameters for different guardrail types.


        Returns a dictionary mapping guardrail providers to their specific parameters,

        including parameter names, descriptions, and whether they are required.


        Example Response:

        ```json

        {

        "bedrock": {

        "guardrailIdentifier": {

        "description": "The ID of your guardrail on Bedrock",

        "required": true,

        "type": null

        },

        "guardrailVersion": {

        "description": "The version of your Bedrock guardrail (e.g., DRAFT or version number)",

        "required": true,

        "type": null

        }

        },

        "azure_content_safety_text_moderation": {

        "api_key": {

        "description": "API key for the Azure Content Safety Text Moderation guardrail",

        "required": false,

        "type": null

        },

        "optional_params": {

        "description": "Optional parameters for the Azure Content Safety Text Moderation guardrail",

        "required": true,

        "type": "nested",

        "fields": {

        "severity_threshold": {

        "description": "Severity threshold for the Azure Content Safety Text Moderation guardrail across all categories",

        "required": false,

        "type": null

        },

        "categories": {

        "description": "Categories to scan for the Azure Content Safety Text Moderation guardrail",

        "required": false,

        "type": "multiselect",

        "options": ["Hate", "SelfHarm", "Sexual", "Violence"],

        "default_value": None

        }

        }

        }

        }

        }

        ```'
      operationId: get_provider_specific_params_guardrails_ui_provider_specific_params_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: Get Provider Specific Params
      tags:
      - guardrails
  /guardrails/usage/detail/{guardrail_id}:
