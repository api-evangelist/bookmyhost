          default: 50
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
      - in: query
        name: action
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      - in: query
        name: start_date
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Date
      - in: query
        name: end_date
        required: false
        schema:
          anyOf:
