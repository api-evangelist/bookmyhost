      description: Return guardrail performance overview for the dashboard.
      operationId: guardrails_usage_overview_guardrails_usage_overview_get
      parameters:
      - description: YYYY-MM-DD
        in: query
        name: start_date
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: YYYY-MM-DD
          title: Start Date
      - description: YYYY-MM-DD
        in: query
        name: end_date
        required: false
