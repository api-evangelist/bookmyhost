  /guardrails/validate_blocked_words_file:
    post:
      description: 'Validate a blocked_words YAML file content.


        Args:

        request: Dictionary with ''file_content'' key containing the YAML string


        Returns:

        Dictionary with ''valid'' boolean and either ''message''/''errors'' depending on result


        Example Request:

        ```json

        {

        "file_content": "blocked_words:\n - keyword: \"test\"\n action: \"BLOCK\""

        }

        ```


        Example Success Response:

        ```json

        {

        "valid": true,

        "message": "Valid YAML file with 2 blocked words"

        }

        ```


        Example Error Response:

        ```json

        {

        "valid": false,

        "errors": ["Entry 0: missing ''action'' field"]

        }

        ```'
      operationId: validate_blocked_words_file_guardrails_validate_blocked_words_file_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                type: string
              title: Request
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Validate Blocked Words File
      tags:
      - guardrails
  /guardrails/{guardrail_id}:
    delete:
      description: 'Delete a guardrail


        👉 Guardrail docs


        Example Request:

        ```bash

        curl -X DELETE "http://localhost:4000/guardrails/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "message": "Guardrail 123e4567-e89b-12d3-a456-426614174000 deleted successfully"

        }

        ```'
      operationId: delete_guardrail_guardrails__guardrail_id__delete
      parameters:
      - in: path
        name: guardrail_id
        required: true
        schema:
          title: Guardrail Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Delete Guardrail
      tags:
      - guardrails
    get:
      description: 'Get detailed information about a specific guardrail by ID


        👉 Guardrail docs


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/guardrails/123e4567-e89b-12d3-a456-426614174000/info" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "guardrail_id": "123e4567-e89b-12d3-a456-426614174000",

        "guardrail_name": "my-bedrock-guard",

        "litellm_params": {

        "guardrail": "bedrock",

        "mode": "pre_call",

        "guardrailIdentifier": "ff6ujrregl1q",

        "guardrailVersion": "DRAFT",

        "default_on": true

        },

        "guardrail_info": {

        "description": "Bedrock content moderation guardrail"

        },

        "created_at": "2023-11-09T12:34:56.789Z",

        "updated_at": "2023-11-09T12:34:56.789Z"

        }

        ```'
      operationId: get_guardrail_info_guardrails__guardrail_id__get
      parameters:
      - in: path
        name: guardrail_id
        required: true
        schema:
          title: Guardrail Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Get Guardrail Info
      tags:
      - guardrails
    patch:
      description: 'Partially update an existing guardrail


        👉 Guardrail docs


        This endpoint allows updating specific fields of a guardrail without sending the entire object.

        Only the following fields can be updated:

        - guardrail_name: The name of the guardrail

        - default_on: Whether the guardrail is enabled by default

        - guardrail_info: Additional information about the guardrail


        Example Request:

        ```bash

        curl -X PATCH "http://localhost:4000/guardrails/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "guardrail_name": "updated-name",

        "default_on": true,

        "guardrail_info": {

        "description": "Updated description"

        }

        }''

        ```


        Example Response:

        ```json

        {

        "guardrail_id": "123e4567-e89b-12d3-a456-426614174000",

        "guardrail_name": "updated-name",

        "litellm_params": {

        "guardrail": "bedrock",

        "mode": "pre_call",

        "guardrailIdentifier": "ff6ujrregl1q",

        "guardrailVersion": "DRAFT",

        "default_on": true

        },

        "guardrail_info": {

        "description": "Updated description"

        },

        "created_at": "2023-11-09T12:34:56.789Z",

