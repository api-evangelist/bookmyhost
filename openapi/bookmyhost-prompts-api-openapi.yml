openapi: 3.2.0
info:
  title: LiteLLM Prompts API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.93.0
tags:
- name: Prompts
paths:
  /prompts:
    post:
      description: 'Create a new prompt


        👉 Prompt docs


        Example Request:

        ```bash

        curl -X POST "http://localhost:4000/prompts" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "prompt_id": "my_prompt",

        "litellm_params": {

        "prompt_id": "json_prompt",

        "prompt_integration": "dotprompt",

        ### EITHER prompt_directory OR prompt_data MUST BE PROVIDED

        "prompt_directory": "/path/to/dotprompt/folder",

        "prompt_data": {"json_prompt": {"content": "This is a prompt", "metadata": {"model": "gpt-4"}}}

        },

        "prompt_info": {

        "prompt_type": "config"

        }

        }''

        ```'
      operationId: create_prompt_prompts_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prompt'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Create Prompt
      tags:
      - Prompts
  /prompts/list:
    get:
      description: 'List the prompts that are available on the proxy server


        👉 Prompt docs


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/prompts/list" -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "prompts": [

        {

        "prompt_id": "my_prompt_id",

        "litellm_params": {

        "prompt_id": "my_prompt_id",

        "prompt_integration": "dotprompt",

        "prompt_directory": "/path/to/prompts"

        },

        "prompt_info": {

        "prompt_type": "config"

        },

        "created_at": "2023-11-09T12:34:56.789Z",

        "updated_at": "2023-11-09T12:34:56.789Z"

        }

        ]

        }

        ```'
      operationId: list_prompts_prompts_list_get
      parameters:
      - in: query
        name: environment
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPromptsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: List Prompts
      tags:
      - Prompts
  /prompts/test:
    post:
      description: 'Test a prompt by rendering it with variables and executing an LLM call.


        This endpoint allows testing prompts before saving them to the database.

        The response is always streamed.


        👉 Prompt docs


        Example Request:

        ```bash

        curl -X POST "http://localhost:4000/prompts/test" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "dotprompt_content": "---\nmodel: gpt-4o\ntemperature: 0.7\n---\n\nUser: Hello {{name}}",

        "prompt_variables": {

        "name": "World"

        }

        }''

        ```'
      operationId: test_prompt_prompts_test_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestPromptRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Test Prompt
      tags:
      - Prompts
  /prompts/{prompt_id}:
    delete:
      description: 'Delete a prompt


        👉 Prompt docs


        Example Request:

        ```bash

        curl -X DELETE "http://localhost:4000/prompts/my_prompt_id" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "message": "Prompt my_prompt_id deleted successfully"

        }

        ```'
      operationId: delete_prompt_prompts__prompt_id__delete
      parameters:
      - in: path
        name: prompt_id
        required: true
        schema:
          title: Prompt Id
          type: string
      - in: query
        name: environment
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Delete Prompt
      tags:
      - Prompts
    get:
      description: 'Get detailed information about a specific prompt by ID, including prompt content


        👉 Prompt docs


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/prompts/my_prompt_id/info" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "prompt_id": "my_prompt_id",

        "litellm_params": {

        "prompt_id": "my_prompt_id",

        "prompt_integration": "dotprompt",

        "prompt_directory": "/path/to/prompts"

        },

        "prompt_info": {

        "prompt_type": "config"

        },

        "created_at": "2023-11-09T12:34:56.789Z",

        "updated_at": "2023-11-09T12:34:56.789Z",

        "content": "System: You are a helpful assistant.


        User: {{user_message}}"

        }

        ```'
      operationId: get_prompt_info_prompts__prompt_id__get
      parameters:
      - in: path
        name: prompt_id
        required: true
        schema:
          title: Prompt Id
          type: string
      - in: query
        name: environment
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptInfoResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Get Prompt Info
      tags:
      - Prompts
    patch:
      description: 'Partially update an existing prompt


        👉 Prompt docs


        This endpoint allows updating specific fields of a prompt without sending the entire object.

        Only the following fields can be updated:

        - litellm_params: LiteLLM parameters for the prompt

        - prompt_info: Additional information about the prompt


        Example Request:

        ```bash

        curl -X PATCH "http://localhost:4000/prompts/my_prompt_id" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "prompt_info": {

        "prompt_type": "db"

        }

        }''

        ```'
      operationId: patch_prompt_prompts__prompt_id__patch
      parameters:
      - in: path
        name: prompt_id
        required: true
        schema:
          title: Prompt Id
          type: string
      - in: query
        name: environment
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPromptRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Patch Prompt
      tags:
      - Prompts
    put:
      description: 'Update an existing prompt


        👉 Prompt docs


        Example Request:

        ```bash

        curl -X PUT "http://localhost:4000/prompts/my_prompt_id" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "prompt_id": "my_prompt",

        "litellm_params": {

        "prompt_id": "my_prompt",

        "prompt_integration": "dotprompt",

        "prompt_directory": "/path/to/prompts"

        },

        "prompt_info": {

        "prompt_type": "config"

        }

        }

        }''

        ```'
      operationId: update_prompt_prompts__prompt_id__put
      parameters:
      - in: path
        name: prompt_id
        required: true
        schema:
          title: Prompt Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prompt'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Update Prompt
      tags:
      - Prompts
  /prompts/{prompt_id}/info:
    get:
      description: 'Get detailed information about a specific prompt by ID, including prompt content


        👉 Prompt docs


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/prompts/my_prompt_id/info" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "prompt_id": "my_prompt_id",

        "litellm_params": {

        "prompt_id": "my_prompt_id",

        "prompt_integration": "dotprompt",

        "prompt_directory": "/path/to/prompts"

        },

        "prompt_info": {

        "prompt_type": "config"

        },

        "created_at": "2023-11-09T12:34:56.789Z",

        "updated_at": "2023-11-09T12:34:56.789Z",

        "content": "System: You are a helpful assistant.


        User: {{user_message}}"

        }

        ```'
      operationId: get_prompt_info_prompts__prompt_id__info_get
      parameters:
      - in: path
        name: prompt_id
        required: true
        schema:
          title: Prompt Id
          type: string
      - in: query
        name: environment
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptInfoResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Get Prompt Info
      tags:
      - Prompts
  /prompts/{prompt_id}/versions:
    get:
      description: 'Get all versions of a specific prompt by base prompt ID


        👉 Prompt docs


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/prompts/jack_success/versions" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "prompts": [

        {

        "prompt_id": "jack_success.v1",

        "litellm_params": {...},

        "prompt_info": {"prompt_type": "db"},

        "created_at": "2023-11-09T12:34:56.789Z",

        "updated_at": "2023-11-09T12:34:56.789Z"

        },

        {

        "prompt_id": "jack_success.v2",

        "litellm_params": {...},

        "prompt_info": {"prompt_type": "db"},

        "created_at": "2023-11-09T13:45:12.345Z",

        "updated_at": "2023-11-09T13:45:12.345Z"

        }

        ]

        }

        ```'
      operationId: get_prompt_versions_prompts__prompt_id__versions_get
      parameters:
      - in: path
        name: prompt_id
        required: true
        schema:
          title: Prompt Id
          type: string
      - in: query
        name: environment
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPromptsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Get Prompt Versions
      tags:
      - Prompts
  /utils/dotprompt_json_converter:
    post:
      description: 'Convert a .prompt file to JSON format.


        This endpoint accepts a .prompt file upload and returns the equivalent JSON representation

        that can be stored in a database or used programmatically.


        Returns the JSON structure with ''content'' and ''metadata'' fields.'
      operationId: convert_prompt_file_to_json_utils_dotprompt_json_converter_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_convert_prompt_file_to_json_utils_dotprompt_json_converter_post'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Convert Prompt File To Json Utils Dotprompt Json Converter Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Convert Prompt File To Json
      tags:
      - Prompts
components:
  schemas:
    TestPromptRequest:
      properties:
        conversation_history:
          anyOf:
          - items:
              additionalProperties:
                type: string
              type: object
            type: array
          - type: 'null'
          title: Conversation History
        dotprompt_content:
          title: Dotprompt Content
          type: string
        prompt_variables:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Prompt Variables
      required:
      - dotprompt_content
      title: TestPromptRequest
      type: object
    PatchPromptRequest:
      properties:
        litellm_params:
          anyOf:
          - $ref: '#/components/schemas/PromptLiteLLMParams'
          - type: 'null'
        prompt_info:
          anyOf:
          - $ref: '#/components/schemas/PromptInfo'
          - type: 'null'
      title: PatchPromptRequest
      type: object
    PromptSpec:
      properties:
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
        environment:
          anyOf:
          - type: string
          - type: 'null'
          default: development
          title: Environment
        litellm_params:
          $ref: '#/components/schemas/PromptLiteLLMParams'
        prompt_id:
          title: Prompt Id
          type: string
        prompt_info:
          $ref: '#/components/schemas/PromptInfo'
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
      required:
      - prompt_id
      - litellm_params
      - prompt_info
      title: PromptSpec
      type: object
    Prompt:
      properties:
        litellm_params:
          $ref: '#/components/schemas/PromptLiteLLMParams'
        prompt_id:
          title: Prompt Id
          type: string
        prompt_info:
          anyOf:
          - $ref: '#/components/schemas/PromptInfo'
          - type: 'null'
      required:
      - prompt_id
      - litellm_params
      title: Prompt
      type: object
    Body_convert_prompt_file_to_json_utils_dotprompt_json_converter_post:
      properties:
        file:
          format: binary
          title: File
          type: string
      required:
      - file
      title: Body_convert_prompt_file_to_json_utils_dotprompt_json_converter_post
      type: object
    ListPromptsResponse:
      properties:
        prompts:
          items:
            $ref: '#/components/schemas/PromptSpec'
          title: Prompts
          type: array
      required:
      - prompts
      title: ListPromptsResponse
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    PromptLiteLLMParams:
      additionalProperties: true
      properties:
        api_base:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Base
        api_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key
        dotprompt_content:
          anyOf:
          - type: string
          - type: 'null'
          title: Dotprompt Content
        ignore_prompt_manager_model:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Ignore Prompt Manager Model
        ignore_prompt_manager_optional_params:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Ignore Prompt Manager Optional Params
        prompt_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Id
        prompt_integration:
          title: Prompt Integration
          type: string
        provider_specific_query_params:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Provider Specific Query Params
      required:
      - prompt_integration
      title: PromptLiteLLMParams
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PromptInfoResponse:
      properties:
        environments:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Environments
        prompt_spec:
          $ref: '#/components/schemas/PromptSpec'
        raw_prompt_template:
          anyOf:
          - $ref: '#/components/schemas/PromptTemplateBase'
          - type: 'null'
      required:
      - prompt_spec
      title: PromptInfoResponse
      type: object
    PromptInfo:
      additionalProperties: true
      properties:
        environment:
          anyOf:
          - type: string
          - type: 'null'
          default: development
          title: Environment
        prompt_type:
          enum:
          - config
          - db
          title: Prompt Type
          type: string
      required:
      - prompt_type
      title: PromptInfo
      type: object
    PromptTemplateBase:
      properties:
        content:
          title: Content
          type: string
        litellm_prompt_id:
          title: Litellm Prompt Id
          type: string
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      required:
      - litellm_prompt_id
      - content
      title: PromptTemplateBase
      type: object
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Bearer token
      in: header
      name: x-litellm-api-key
